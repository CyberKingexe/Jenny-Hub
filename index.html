<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Jenny Hub 🩷 | Jenny Mod</title>
<meta name="description" content="Jenny Mod برای Minecraft Java 1.12.2 و Bedrock 1.19.50 به بالا"/>
<meta name="robots" content="index, follow"/>
<script>
(function(){
  try {
    if (localStorage.getItem('mcmod-dark') === '1') {
      document.documentElement.classList.add('dark-pending');
    }
  } catch (e) {}
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg: #f2f3f6;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --border: #e4e7ec;
  --text: #16202f;
  --text-2: #4b5768;
  --text-3: #94a0b0;
  --primary: #1e3a5f;
  --primary-2: #14283f;
  --accent: #2f6fb0;
  --accent-2: #5fa8e0;
  --success: #0f7a52;
  --radius-lg: 18px;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(15,23,42,0.05), 0 10px 28px rgba(15,23,42,0.07);
  --shadow-lg: 0 2px 6px rgba(15,23,42,0.07), 0 20px 52px rgba(15,23,42,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { overflow-x: hidden; }

body {
  font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  -webkit-font-smoothing: antialiased;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse 900px 500px at 50% -80px, color-mix(in srgb, var(--primary) 7%, transparent), transparent 70%);
}
::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

html.dark-pending body, body.dark {
  --bg: #0b0f16;
  --surface: #121826;
  --surface-2: #171f30;
  --border: #263248;
  --text: #e8ecf5;
  --text-2: #939fb5;
  --text-3: #5c6780;
  --accent: #5fa8e0;
  --accent-2: #8cc4ef;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.35);
  --shadow-lg: 0 2px 6px rgba(0,0,0,0.35), 0 20px 52px rgba(0,0,0,0.5);
  background: var(--bg);
  color: var(--text);
}

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(120deg, #14283f, #1e3a5f, #223f66);
  background-size: 220% 220%;
  animation: holo-shift 26s ease infinite;
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 0 var(--accent-2), 0 1px 0 rgba(255,255,255,0.12) inset, 0 6px 22px rgba(15,23,42,0.28);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
html.dark-pending body .header, body.dark .header {
  background: linear-gradient(120deg, #0a121e, #14243a, #182c46);
  background-size: 220% 220%;
  box-shadow: 0 2px 0 var(--accent-2), 0 1px 0 rgba(255,255,255,0.06) inset, 0 6px 22px rgba(0,0,0,0.45);
}
@keyframes holo-shift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.header h1 {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.25);
}
.icon-btn {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  flex-shrink: 0;
}
.icon-btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: var(--accent-2);
  box-shadow: 0 0 0 3px rgba(95,168,224,0.22);
}

.wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }

/* Hero */
.hero { text-align: center; margin-bottom: 26px; }
.hero h2 {
  font-size: 1.55rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  margin-bottom: 8px;
  color: var(--text);
  position: relative;
  display: inline-block;
  padding-bottom: 10px;
}
.hero h2::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 56px; height: 3px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}
.hero p {
  color: var(--text-2);
  font-size: 0.9rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  max-width: 480px;
  margin: 0 auto;
}

/* Download cards */
.dl-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
  margin-bottom: 22px;
}
@media (min-width: 640px) {
  .dl-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
}

.dl-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px 22px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}
.dl-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius-lg);
  padding: 1px;
  background: linear-gradient(135deg, rgba(47,111,176,0.4), rgba(95,168,224,0.2), rgba(30,58,95,0.3));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0.7;
}
html.dark-pending body .dl-card::before, body.dark .dl-card::before {
  background: linear-gradient(135deg, rgba(95,168,224,0.55), rgba(140,196,239,0.3), rgba(79,147,217,0.4));
  opacity: 0.95;
}
.dl-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.dl-icon {
  width: 68px;
  height: 68px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.1rem;
  margin-bottom: 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  box-shadow: 0 6px 18px rgba(30,58,95,0.28);
  flex-shrink: 0;
}
.dl-card h3 {
  font-size: 1.15rem;
  font-weight: 800;
  margin-bottom: 6px;
  color: var(--text);
}
.dl-card .dl-tag {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--accent);
  margin-bottom: 12px;
  letter-spacing: 0.02em;
}
html.dark-pending body .dl-card .dl-tag, body.dark .dl-card .dl-tag {
  background: color-mix(in srgb, var(--accent-2) 16%, transparent);
  color: var(--accent-2);
}
.dl-card p {
  font-size: 0.85rem;
  color: var(--text-2);
  line-height: 1.75;
  margin-bottom: 20px;
  flex: 1;
}

a.dl-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: #fff;
  padding: 13px 18px;
  border-radius: var(--radius-sm);
  text-decoration: none;
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  transition: all 0.22s ease;
  box-shadow: 0 4px 14px rgba(30,58,95,0.28);
}
a.dl-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(30,58,95,0.35);
}
a.dl-btn:active { transform: translateY(0); }

/* Info card */
.info-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  border-right: 3px solid var(--accent);
}
.info-card h4 {
  font-size: 0.78rem;
  color: var(--text-3);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.info-card p {
  font-size: 0.86rem;
  color: var(--text-2);
  line-height: 1.8;
  margin: 6px 0;
}

.site-footer {
  text-align: center;
  margin-top: 30px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  color: var(--text-3);
  font-size: 0.76rem;
  line-height: 1.9;
}

@media (max-width: 380px) {
  .dl-card { padding: 22px 16px; }
  .hero h2 { font-size: 1.35rem; }
}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1e3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jenny Hub">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">

</head>
<body>

<div class="header">
  <h1>Jenny Hub 🩷</h1>
  <button class="icon-btn" id="themeDarkBtn" onclick="toggleDark()" title="حالت شب">🌙</button>
</div>

<div class="wrap">

  <div class="hero">
    <h2>🩷 Jenny Mod</h2>
    <p>📲 پلتفرم خود را انتخاب کنید</p>
  </div>

  <div class="dl-grid">

    <!-- Bedrock -->
    <div class="dl-card">
      <div class="dl-icon">🧱</div>
      
      <h3>🧱 Bedrock</h3>
      
      <!-- TODO: لینک دانلود Bedrock رو اینجا جایگزین کن -->
      <a class="dl-btn" href="#" target="_blank" rel="noopener" id="bedrockLink">
        ⬇️ Jenny Mod
      </a>
    </div>

    <!-- Java -->
    <div class="dl-card">
      <div class="dl-icon">☕</div>
      
      <h3>☕ Java</h3>
      
      <!-- TODO: لینک دانلود Java رو اینجا جایگزین کن -->
      <a class="dl-btn" href="#" target="_blank" rel="noopener" id="javaLink">
        ⬇️ Jenny Mod
      </a>
    </div>

  </div>

  <div class="info-card">
    <p>🩷 Jenny Mod برای Minecraft Java نسخه <b>1.12.2</b> و Bedrock نسخه <b>1.19.50 به بالا</b> ارائه می‌شود.</p>
  </div>

  <footer class="site-footer">
    <div>Jenny Hub 🩷</div>
  </footer>

</div>

<script>
function applyDark(on) {
  document.body.classList.toggle('dark', on);
  document.documentElement.classList.remove('dark-pending');
  try { localStorage.setItem('mcmod-dark', on ? '1' : '0'); } catch (e) {}
}
function toggleDark() {
  applyDark(!document.body.classList.contains('dark'));
}
(function(){
  try {
    if (localStorage.getItem('mcmod-dark') === '1') {
      document.body.classList.add('dark');
    }
  } catch (e) {}
  document.documentElement.classList.remove('dark-pending');
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
      .catch(function (error) {
        console.warn("PWA Service Worker registration failed:", error);
      });
  });
}
</script>

</body>
</html>
